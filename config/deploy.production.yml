service: test-fastapi-complex-production
image: badri/test-fastapi-complex
servers:
  web:
    hosts:
    - $DEST_VM_HOST
  worker:
    hosts:
    - $DEST_VM_HOST
    cmd: celery -A app.worker worker --loglevel=info
proxy:
  ssl: false
  host: test-fastapi-complex-production.vmkit.app
  app_port: 8000
  healthcheck:
    path: /health
    interval: 3
    timeout: 30
registry:
  server: ghcr.io
  username: vmkit-deploy[bot]
  password:
  - KAMAL_REGISTRY_PASSWORD
ssh:
  user: kamal
builder:
  arch: amd64
env:
  clear:
    PYTHONUNBUFFERED: '1'
  secret:
  - DATABASE_URL
  - REDIS_URL
accessories:
  postgres:
    image: postgres:16-alpine
    host: $DEST_VM_HOST
    port: 5432
    env:
      clear:
        POSTGRES_USER: demo
        POSTGRES_DB: demo
      secret:
      - POSTGRES_PASSWORD
    volumes:
    - test-fastapi-complex-production-postgres:/var/lib/postgresql/data
  redis:
    image: redis:7-alpine
    host: $DEST_VM_HOST
    port: 6379
